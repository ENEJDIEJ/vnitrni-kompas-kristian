<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">Vnitřní kompas jako cesta z pěti trojrozměrných dílků</title>
  <desc id="description">Perspektivní hand drawn doodle cesta. Emoce upozorňují, potřeby ukazují, o co jde, hodnoty se proměňují v čin, opakováním vzniká identita a ta dává směr vizi.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Caveat KK";
        src: url("../Caveat-Variable.ttf") format("truetype");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Manrope KK";
        src: url("../Manrope-Variable.ttf") format("truetype");
        font-weight: 300 900;
      }
      .sans { font-family: "Manrope KK", Manrope, Arial, sans-serif; fill: #111111; }
      .hand { font-family: "Caveat KK", Caveat, cursive; fill: #111111; }
      .pointer { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 8; }
    </style>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3" fill="#FFD928"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#FFFFFF"/>
  <image href="vnitrni-kompas-puzzle-3d-art-v2.png" x="0" y="90" width="1600" height="875" preserveAspectRatio="xMidYMid meet"/>

  <g transform="translate(68 48)">
    <text class="sans" x="0" y="0" dominant-baseline="hanging" font-size="17" font-weight="850" letter-spacing=".22em">VNITŘNÍ KOMPAS</text>
    <text class="hand" x="0" y="39" dominant-baseline="hanging" font-size="48" font-weight="650">Od prvního signálu k životu podle sebe.</text>
  </g>

  <!-- Popisky zůstávají mimo generovanou kresbu a ve videu je lze odhalovat postupně. -->
  <g>
    <g transform="translate(135 216)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">01 · EMOCE</text>
      <text class="hand" x="0" y="37" font-size="29" font-weight="650">upozorňuje</text>
      <path class="pointer" d="M92 49 C112 72 124 94 132 126" marker-end="url(#dot)"/>
    </g>

    <g transform="translate(452 172)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">02 · POTŘEBY</text>
      <text class="hand" x="0" y="37" font-size="29" font-weight="650">ukazují, o co jde</text>
      <path class="pointer" d="M128 49 C142 66 150 82 154 104" marker-end="url(#dot)"/>
    </g>

    <g transform="translate(744 132)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">03 · HODNOTY</text>
      <text class="hand" x="0" y="37" font-size="29" font-weight="650">proměňuji v čin</text>
      <path class="pointer" d="M118 49 C130 63 139 78 143 96" marker-end="url(#dot)"/>
    </g>

    <g transform="translate(1031 102)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">04 · IDENTITA</text>
      <text class="hand" x="0" y="37" font-size="29" font-weight="650">opakováním vzniká směr</text>
      <path class="pointer" d="M151 49 C158 61 164 73 166 87" marker-end="url(#dot)"/>
    </g>

    <g transform="translate(1366 62)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">05 · VIZE</text>
      <text class="hand" x="0" y="37" font-size="29" font-weight="650">žiju po svém</text>
    </g>
  </g>

  <path d="M104 1007 H1496" fill="none" stroke="#D9D9D3" stroke-width="2"/>
  <text class="hand" x="800" y="1060" text-anchor="middle" font-size="30" font-weight="600">Pět dílků. Jedna cesta. Jeden obraz života, který chceš postupně tvořit.</text>
  <circle cx="1464" cy="1048" r="13" fill="#FFD928"/>
</svg>
