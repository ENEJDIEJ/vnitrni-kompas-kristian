<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Vnitřní kompas: od signálu ke směru</title>
  <desc id="description">Pět navazujících zastavení programu: emoce, potřeby, hodnoty, identita a vize.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="marker" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .04" numOctaves="1" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      @font-face {
        font-family: "Caveat KK";
        src: url("../Caveat-Variable.ttf") format("truetype");
        font-weight: 400 700;
      }
      .sans { font-family: Manrope, Arial, sans-serif; fill: #111111; }
      .hand { font-family: "Caveat KK", Caveat, cursive; fill: #111111; }
      .line { fill: none; stroke: #111111; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: url(#marker); }
      .thin { fill: none; stroke: #111111; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; filter: url(#marker); }
      .yellow-line { fill: none; stroke: #FFD928; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; filter: url(#marker); }
      .step { font-size: 17px; font-weight: 800; letter-spacing: .18em; }
      .question { font-size: 27px; font-weight: 600; }
      .number { font-size: 28px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g transform="translate(90 64)">
    <text class="sans" x="0" y="0" dominant-baseline="hanging" font-size="18" font-weight="800" letter-spacing=".22em">VNITŘNÍ KOMPAS</text>
    <text class="sans" x="0" y="46" dominant-baseline="hanging" font-size="58" font-weight="500">Od toho, co se ve mně děje,</text>
    <text class="hand" x="0" y="105" dominant-baseline="hanging" font-size="62" font-weight="650">k životu, který chci tvořit.</text>
  </g>

  <!-- Jedna žlutá cesta, kterou lze ve videu dokreslovat zleva doprava. -->
  <path class="yellow-line" d="M150 446 C275 362 349 541 476 449 C593 363 676 535 797 447 C919 360 994 528 1119 444 C1244 361 1325 406 1460 330"/>
  <!-- 01 Emoce -->
  <g transform="translate(84 265)">
    <circle cx="112" cy="135" r="105" fill="#FFFFFF"/>
    <circle class="line" cx="112" cy="73" r="23"/>
    <path class="line" d="M70 197 C70 145 84 108 112 107 C140 108 154 145 154 197"/>
    <path class="thin" d="M84 125 L57 158 M140 125 L169 157"/>
    <circle cx="112" cy="151" r="17" fill="#FFD928"/>
    <path class="thin" d="M112 128 C101 132 97 143 99 153 M112 174 C123 170 128 159 126 149"/>
    <path class="thin" d="M78 151 C69 145 63 137 60 128 M146 151 C155 145 161 137 164 128"/>
    <path class="thin" d="M84 175 C76 181 71 188 69 197 M140 175 C148 181 153 188 155 197"/>
    <text class="sans number" x="26" y="16">01</text>
    <text class="sans step" x="112" y="275" text-anchor="middle">EMOCE</text>
    <text class="hand question" x="112" y="319" text-anchor="middle">
      <tspan x="112">Co se ve mně</tspan><tspan x="112" dy="31">děje?</tspan>
    </text>
  </g>

  <!-- 02 Potřeby -->
  <g transform="translate(370 286)">
    <circle cx="112" cy="114" r="105" fill="#FFFFFF"/>
    <path class="line" d="M42 139 C72 135 92 138 112 139 C134 140 154 136 182 139"/>
    <path class="line" d="M112 139 C111 119 112 97 114 75"/>
    <path class="line" d="M113 105 C91 105 78 91 78 76 C96 74 109 84 113 105 Z"/>
    <path class="line" d="M113 91 C135 91 148 77 148 62 C130 60 117 70 113 91 Z"/>
    <circle cx="112" cy="151" r="15" fill="#FFD928"/>
    <path class="thin" d="M112 151 C99 160 91 171 85 188 M112 151 C125 160 133 171 139 188 M102 163 L79 163 M122 163 L146 163 M94 176 L74 184 M130 176 L151 184"/>
    <text class="sans number" x="26" y="-5">02</text>
    <text class="sans step" x="112" y="254" text-anchor="middle">POTŘEBY</text>
    <text class="hand question" x="112" y="298" text-anchor="middle">
      <tspan x="112">Co je teď</tspan><tspan x="112" dy="31">důležité?</tspan>
    </text>
  </g>

  <!-- 03 Hodnoty -->
  <g transform="translate(657 264)">
    <circle cx="112" cy="136" r="105" fill="#FFFFFF"/>
    <circle class="line" cx="112" cy="136" r="70"/>
    <circle class="thin" cx="112" cy="136" r="8"/>
    <path class="line" d="M112 67 L132 126 L112 205 L92 146 Z"/>
    <path d="M112 67 L132 126 L112 136 L92 146 Z" fill="#FFD928"/>
    <path class="thin" d="M112 53 V40 M112 232 V219 M25 136 H38 M186 136 H199"/>
    <text class="sans number" x="26" y="16">03</text>
    <text class="sans step" x="112" y="276" text-anchor="middle">HODNOTY</text>
    <text class="hand question" x="112" y="320" text-anchor="middle">
      <tspan x="112">Podle čeho</tspan><tspan x="112" dy="31">chci jednat?</tspan>
    </text>
  </g>

  <!-- 04 Identita -->
  <g transform="translate(944 277)">
    <circle cx="112" cy="123" r="105" fill="#FFFFFF"/>
    <circle class="line" cx="112" cy="76" r="24"/>
    <path class="line" d="M112 101 C88 109 78 134 81 161 M112 101 C136 109 147 134 144 161 M81 161 C99 174 125 174 144 161"/>
    <path class="thin" d="M79 125 L51 148 M145 125 L172 146 M96 168 L81 201 M129 168 L148 198"/>
    <ellipse cx="68" cy="202" rx="18" ry="8" transform="rotate(-18 68 202)" fill="#FFD928"/>
    <ellipse cx="157" cy="207" rx="18" ry="8" transform="rotate(18 157 207)" fill="#FFD928"/>
    <text class="sans number" x="26" y="3">04</text>
    <text class="sans step" x="112" y="263" text-anchor="middle">IDENTITA</text>
    <text class="hand question" x="112" y="307" text-anchor="middle">
      <tspan x="112">Kým se svými</tspan><tspan x="112" dy="31">kroky stávám?</tspan>
    </text>
  </g>

  <!-- 05 Vize -->
  <g transform="translate(1230 217)">
    <circle cx="112" cy="183" r="105" fill="#FFFFFF"/>
    <path class="line" d="M29 217 C63 198 92 201 119 217 C145 232 171 232 198 212"/>
    <path class="line" d="M62 215 L62 155 L116 114 L169 155 L169 216"/>
    <path class="thin" d="M83 215 V174 H109 V215 M135 159 H153 V179 H135 Z"/>
    <circle cx="158" cy="92" r="28" fill="#FFD928"/>
    <path class="thin" d="M158 49 V35 M158 149 V135 M115 92 H101 M215 92 H201 M127 61 L117 51 M198 132 L188 122 M188 61 L198 51"/>
    <text class="sans number" x="26" y="63">05</text>
    <text class="sans step" x="112" y="323" text-anchor="middle">VIZE</text>
    <text class="hand question" x="112" y="367" text-anchor="middle">
      <tspan x="112">Jak chci</tspan><tspan x="112" dy="31">doopravdy žít?</tspan>
    </text>
  </g>

  <!-- Slovní vazby jsou samostatně nad kresbou, aby je bylo možné ve videu dopisovat po jedné. -->
  <g class="hand" font-size="20" font-weight="650" text-anchor="middle">
    <path class="thin" d="M286 431 C318 417 345 418 378 433" marker-end="url(#arrow)"/>
    <text x="332" y="397">ukazuje</text>
    <path class="thin" d="M574 433 C606 417 633 418 665 433" marker-end="url(#arrow)"/>
    <text x="619" y="397">pomáhá volit</text>
    <path class="thin" d="M861 431 C893 416 921 416 952 431" marker-end="url(#arrow)"/>
    <text x="906" y="394">mění se v činy</text>
    <path class="thin" d="M1148 429 C1180 411 1208 400 1238 385" marker-end="url(#arrow)"/>
    <text x="1191" y="365">tvoří směr</text>
  </g>

  <g transform="translate(125 742)">
    <path class="thin" d="M0 0 H1350"/>
    <text class="sans" x="0" y="46" font-size="17" font-weight="800" letter-spacing=".16em">VŠIMNOUT SI</text>
    <text class="hand" x="201" y="49" font-size="34">→</text>
    <text class="sans" x="248" y="46" font-size="17" font-weight="800" letter-spacing=".16em">POCHOPIT</text>
    <text class="hand" x="423" y="49" font-size="34">→</text>
    <text class="sans" x="470" y="46" font-size="17" font-weight="800" letter-spacing=".16em">ZVOLIT</text>
    <text class="hand" x="613" y="49" font-size="34">→</text>
    <text class="sans" x="660" y="46" font-size="17" font-weight="800" letter-spacing=".16em">VYZKOUŠET</text>
    <text class="hand" x="857" y="49" font-size="34">→</text>
    <text class="sans" x="904" y="46" font-size="17" font-weight="800" letter-spacing=".16em">ŽÍT PO SVÉM</text>
    <circle cx="1320" cy="40" r="13" fill="#FFD928"/>
  </g>

  <text class="hand" x="800" y="862" text-anchor="middle" font-size="30">Nejde o to se opravit. Jde o to naučit se číst vlastní kompas.</text>
</svg>
