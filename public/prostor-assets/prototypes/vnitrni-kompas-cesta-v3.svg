<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">Vnitřní kompas jako jedna souvislá cesta</title>
  <desc id="description">Čistá perspektivní cesta od emoce přes potřeby, hodnoty a identitu až k vizi. Jednotlivá zastavení propojuje žlutá linka a tečkované šipky vedou k vysvětlujícím textům.</desc>
  <defs>
    <style>
      @font-face {
        font-family: "Caveat KK";
        src: url("../Caveat-Variable.ttf") format("truetype");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Manrope KK";
        src: url("../Manrope-Variable.ttf") format("truetype");
        font-weight: 300 900;
      }
      .sans { font-family: "Manrope KK", Manrope, Arial, sans-serif; fill: #111111; }
      .hand { font-family: "Caveat KK", Caveat, cursive; fill: #111111; }
      .pointer {
        fill: none;
        stroke: #111111;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 2 9;
      }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4.5 L0 9" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#FFFFFF"/>
  <image href="vnitrni-kompas-cesta-art-v3.png" x="0" y="105" width="1600" height="900" preserveAspectRatio="xMidYMid meet"/>

  <g transform="translate(68 46)">
    <text class="sans" x="0" y="0" dominant-baseline="hanging" font-size="17" font-weight="850" letter-spacing=".22em">VNITŘNÍ KOMPAS</text>
    <text class="hand" x="0" y="39" dominant-baseline="hanging" font-size="48" font-weight="650">Od prvního signálu k životu podle sebe.</text>
  </g>

  <!-- Text zůstává mimo generovanou kresbu, aby byl ostrý a ve videu šel odhalovat postupně. -->
  <g>
    <g transform="translate(96 205)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">01 · EMOCE</text>
      <text class="hand" x="0" y="38" font-size="30" font-weight="650">upozorňuje</text>
      <path class="pointer" d="M108 51 C145 122 175 248 184 360" marker-end="url(#arrow)"/>
      <circle cx="184" cy="360" r="5" fill="#FFD928"/>
    </g>

    <g transform="translate(395 171)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">02 · POTŘEBY</text>
      <text class="hand" x="0" y="38" font-size="30" font-weight="650">ukazují, o co jde</text>
      <path class="pointer" d="M154 51 C194 121 220 272 225 414" marker-end="url(#arrow)"/>
      <circle cx="225" cy="414" r="5" fill="#FFD928"/>
    </g>

    <g transform="translate(704 137)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">03 · HODNOTY</text>
      <text class="hand" x="0" y="38" font-size="30" font-weight="650">proměňuji v čin</text>
      <path class="pointer" d="M151 51 C188 106 207 243 206 373" marker-end="url(#arrow)"/>
      <circle cx="206" cy="373" r="5" fill="#FFD928"/>
    </g>

    <g transform="translate(1002 107)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">04 · IDENTITA</text>
      <text class="hand" x="0" y="38" font-size="30" font-weight="650">opakováním vzniká směr</text>
      <path class="pointer" d="M170 51 C192 99 188 205 168 303" marker-end="url(#arrow)"/>
      <circle cx="168" cy="303" r="5" fill="#FFD928"/>
    </g>

    <g transform="translate(1372 69)">
      <text class="sans" x="0" y="0" font-size="14" font-weight="850" letter-spacing=".16em">05 · VIZE</text>
      <text class="hand" x="0" y="38" font-size="30" font-weight="650">žiju po svém</text>
      <path class="pointer" d="M60 51 C74 93 74 159 63 216" marker-end="url(#arrow)"/>
      <circle cx="63" cy="216" r="5" fill="#FFD928"/>
    </g>
  </g>

  <path d="M104 1008 H1496" fill="none" stroke="#D9D9D3" stroke-width="2"/>
  <text class="hand" x="800" y="1061" text-anchor="middle" font-size="31" font-weight="600">Pět zastavení. Jedna cesta. Jeden obraz života, který chceš postupně tvořit.</text>
  <circle cx="1470" cy="1049" r="13" fill="#FFD928"/>
</svg>
